 return `<div class="pg"><span>Total ${total}</span><span class="pgsz" onclick="pgDd(event)">${g.s}/page <i>⌄</i><span class="pgdd">${[10,20,30,40,50,100].map(n=>`<span class="${n===g.s?'on':''}" onclick="event.stopPropagation();pgSize('${k}',${n})">${n}/page</span>`).join('')}</span></span>
