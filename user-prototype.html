.card:first-of-type{margin-top:-24px;position:relative}

 top:{name:'昨日达到最高档（₱12,350）',bets:12350},
 mid:{name:'昨日达到中间档（₱6,200）',bets:6200},
 none:{name:'昨日未达标（₱650）',bets:650},
 pre:{name:'自动发放前（08:00）',bets:12350,pre:true,autoOnly:true},
 multi:{name:'多天未领取（手动）',bets:6200,older:[['Nov 16',5400],['Nov 15',10800]],manualOnly:true}
};
let cfg={mode:'manual',calc:'single',sc:'top'},S;
function reward(b){const hit=TIERS.filter(t=>b>=t[0]);if(!hit.length)return {amt:0,hit:[]};return cfg.calc==='sum'?{amt:hit.reduce((a,t)=>a+t[1],0),hit}:{amt:hit[hit.length-1][1],hit:[hit[hit.length-1]]};}
function init(){const c=SC[cfg.sc];document.getElementById('toast').style.display='none';
 if(c.autoOnly&&cfg.mode!=='auto')cfg.mode='auto';if(c.manualOnly&&cfg.mode!=='manual')cfg.mode='manual';
 S={bets:c.bets,claimed:false,pre:!!c.pre,bal:13887.68,
   older:(c.older||[]).map(o=>({d:o[0],bets:o[1],claimed:false})),
   rec:[['Nov 14',8200,'c'],['Nov 13',1500,'c'],['Nov 12',400,'n'],['Nov 11',11000,'e'],['Nov 10',5300,'c'],['Nov 9',2100,'c'],['Nov 8',12800,'c'],['Nov 7',900,'n'],['Nov 6',6100,'c'],['Nov 5',3300,'c'],['Nov 4',10200,'c'],['Nov 3',700,'n']]};
 if(cfg.mode==='auto')S.rec=S.rec.map(r=>[r[0],r[1],r[2]==='n'?'n':'a']);
 renderPanel();setPend(false);go('home');render();}
function pick(k,v){cfg[k]=v;init();}
function renderPanel(){const b=(k,v,t)=>`<button class="${cfg[k]===v?'on':''}" onclick="pick('${k}','${v}')">${t}</button>`;
 document.getElementById('pMode').innerHTML=b('mode','manual','手动领取')+b('mode','auto','自动发放');
 document.getElementById('pCalc').innerHTML=b('calc','single','不累加（默认）')+b('calc','sum','累加');
 document.getElementById('pSc').innerHTML=Object.entries(SC).map(([k,v])=>b('sc',k,v.name+(v.autoOnly?' · 自动':v.manualOnly?' · 手动':''))).join('');
 const r=reward(SC[cfg.sc].bets);
 document.getElementById('desc').innerHTML=`今天 ${TODAY}。档位：≥₱1,000 返 ₱1，≥₱5,000 返 ₱5，≥₱10,000 返 ₱10。<br>`+(cfg.sc==='none'?'昨日投注未达到最低档，没有奖励。':cfg.sc==='multi'?`手动领取的奖励保留 ${KEEP} 天（后台配置，只对手动领取生效），过期作废；每天的奖励分别领取。`:cfg.sc==='pre'?`自动发放：每天 ${AUTO_AT}（后台配置）自动发放到余额。界面始终显示说明「每天 ${AUTO_AT} 自动发放」；发放前按钮显示发放时间。自动发放没有领取期限。`:`昨日投注 ${fmt(SC[cfg.sc].bets)}，${cfg.calc==='sum'?'累加：达到的各档奖励相加':'不累加：只取达到的最高一档'}，奖励 ${fmt(r.amt)}。`);}
function render(){const b=document.getElementById('actBody'),r=reward(S.bets),man=cfg.mode==='manual';let top;
 {
  let act='';
  if(!r.amt)act=`<button class="btn" disabled>No reward</button><div class="exp" style="color:#888">Bet ${fmt(TIERS[0][0])} or more in a day to get a reward.</div>`;
  else if(man)act=S.claimed?`<button class="btn done">✓ Claimed</button>`:`<button class="btn pulse" id="clm" onclick="claim()">Claim</button><div class="exp">Claim by ${expDay()}</div>`;
  else act=(S.pre?`<button class="btn" disabled>Credits at ${AUTO_AT}</button>`:`<button class="btn done">✓ Credited to your balance</button>`)+`<div class="exp" style="color:#037e70">Rewards are sent automatically at ${AUTO_AT} every day.</div>`;
  top=`<div class="res"><div class="l">Your Reward</div><div class="v">${fmt(r.amt)}</div></div>
   <div class="bets"><span>Yesterday's bets</span><b>${fmt(S.bets)}</b></div>${act}`;}
 const older=S.older.filter(o=>!o.claimed);
 b.innerHTML=`<div class="card"><div class="ttl"><b>Yesterday's Reward</b><span class="rt">Nov 17</span></div>${top}
  ${older.length?`<div class="sub" style="margin-top:12px"><b>Unclaimed</b></div>${older.map((o,i)=>`<div class="prow"><div class="d"><b>${o.d}</b>Bets ${fmt(o.bets)} · Claim by ${expDay(o.d)}</div><div class="a">${fmt(reward(o.bets).amt)}</div><button class="sbtn" onclick="claimOld(${S.older.indexOf(o)},this)">Claim</button></div>`).join('')}`:''}</div>
 <div class="card"><div class="ttl"><b>Reward Tiers</b><span class="rt">Daily bets</span></div>
  <table class="tier">${TIERS.map(t=>{const h=S.bets>=t[0];return `<tr class="${h?'hit':''}"><td>Bet ≥ ${fmt(t[0])}${h?'<span class="tk">Reached</span>':''}</td><td>${fmt(t[1])}</td></tr>`}).join('')}</table>
  <div class="note">${cfg.calc==='sum'?'Rewards of all tiers you reach are added up.':'You get the reward of the highest tier you reach.'}</div></div>`;}
function expDay(d){const n=d?parseInt(d.split(' ')[1]):17;return 'Nov '+(n+KEEP);}
function fly(el,done){const sc=document.getElementById('screen').getBoundingClientRect(),f=el.getBoundingClientRect();
 for(let k=0;k<8;k++){const c=document.createElement('img');c.src=IMG.coins;c.className='flycoin';document.getElementById('screen').appendChild(c);
  const x0=f.left-sc.left+f.width/2-12+(Math.random()*40-20),y0=f.top-sc.top,x1=sc.width-60,y1=20;
  c.animate([{transform:`translate(${x0}px,${y0}px) scale(.6)`,opacity:0},{transform:`translate(${x0}px,${y0-40}px) scale(1.15)`,opacity:1,offset:.3},{transform:`translate(${x1}px,${y1}px) scale(.4)`,opacity:0}],{duration:800,delay:k*55}).onfinish=()=>c.remove();}
 setTimeout(()=>done&&done(),900);}
function claim(){const r=reward(S.bets);const el=document.getElementById('clm');el.style.visibility='hidden';S.claimed=true;S.bal+=r.amt;S.rec.unshift(['Nov 17',S.bets,'c']);fly(el,()=>{render();toastI('Claimed '+fmt(r.amt),'Added to your balance');});}
function claimOld(i,el){const o=S.older[i];o.claimed=true;el.style.visibility='hidden';const a=reward(o.bets).amt;S.rec.unshift([o.d,o.bets,'c']);fly(el,()=>{render();toastI('Claimed '+fmt(a),'Added to your balance');});}
function stTag(s){return s==='c'?'<span class="stt s-c">Claimed</span>':s==='a'?'<span class="stt s-a">Credited</span>':s==='e'?'<span class="stt s-e">Expired</span>':'<span class="stt s-n">—</span>';}
function openHist(){const rows=S.rec.slice().sort((a,b)=>parseInt(b[0].split(' ')[1])-parseInt(a[0].split(' ')[1]));
 openM(`<div class="hsHead">History<span class="x2" onclick="closeM()">✕</span></div><div class="hsBody"><table class="h2"><tr><th>Date</th><th>Bets</th><th>Reward</th><th>Status</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${fmt(r[1])}</td><td><b>${fmt(reward(r[1]).amt)}</b></td><td>${stTag(r[2])}</td></tr>`).join('')}</table><div style="text-align:center;font-size:11.5px;color:#999;padding:10px 0 0">No more records</div></div>`);}
function openRules(){openM(`<div class="hsHead">Activity description<span class="x2" onclick="closeM()">✕</span></div><div class="hsBody">
 <div class="rh">Daily Bet Bonus</div>
 <ol class="rl"><li>Your valid bets from 00:00 to 23:59 each day are added up.</li>
 <li>Reach a tier to get its reward:</li></ol>
 <table class="rt"><tr><th>Daily bets</th><th>Reward</th></tr>${TIERS.map(t=>`<tr><td>≥ ${fmt(t[0])}</td><td>${fmt(t[1])}</td></tr>`).join('')}</table>
 <ol class="rl" start="3" style="margin-top:10px"><li>${cfg.calc==='sum'?'Rewards of all tiers you reach are added up.':'You get the reward of the highest tier you reach.'}</li>
 <li>One reward per day. Results are ready after 1:00 AM the next day.</li>
 <li>${cfg.mode==='manual'?`Claim your reward within ${KEEP} days, or it expires.`:`Rewards are sent to your balance automatically at ${AUTO_AT}.`}</li>
 <li>Rewards need wagering before withdrawal: reward × multiplier of the game type (${WAGER}).</li></ol></div>`);}
function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));document.getElementById(v).scrollTop=0;closeM();}
function openM(h){document.getElementById('sheet').innerHTML=h;document.getElementById('mask').classList.add('on');}
function closeM(){document.getElementById('mask').classList.remove('on');}
document.getElementById('mask').addEventListener('click',e=>{if(e.target.id==='mask')closeM();});
function toastI(t,sub){const e=document.getElementById('toast');e.innerHTML=`<span class="ti">✓</span><div><div style="font-weight:700">${t}</div>${sub?`<div style="font-size:11.5px;opacity:.85">${sub}</div>`:''}</div>`;e.style.display='flex';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2200);}
function enter(){go('act');}
function setPend(o){document.getElementById('pend').style.display=o?'none':'block';document.getElementById('wOpen').style.display=o?'block':'none';}
function toast(t){const e=document.getElementById('toast');e.innerHTML=t;e.style.display='flex';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1800);}
init();
</script>
</body></html>
