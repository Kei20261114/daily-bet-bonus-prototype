<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日投注奖（Daily Bet Bonus）活动详情页原型 · 789Games</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#eceff3;font:14px/1.5 -apple-system,"SF Pro Text","PingFang SC","Noto Sans CJK SC",sans-serif;color:#222}
.layout{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:24px 16px 60px;flex-wrap:wrap}
.phone{width:390px;height:844px;border-radius:44px;background:#000;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.25);flex:none}
.screen{width:370px;height:824px;border-radius:36px;overflow:hidden;position:relative;background:#fff}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;scrollbar-width:none}.view::-webkit-scrollbar{display:none}.view.on{display:block}
#homeImg,#loginImg{width:370px;display:block}
.hot{position:absolute;cursor:pointer}
.pulse{animation:pulse 1.6s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,170,0,.7)}70%{box-shadow:0 0 0 10px rgba(255,170,0,0)}100%{box-shadow:0 0 0 0 rgba(255,170,0,0)}}
/* activity */
#act{background:linear-gradient(180deg,#e6f6f2 0,#f1f8f6 40%,#f6f9f8)}
.hero{position:relative;height:200px;background:radial-gradient(circle at 80% 30%,#ffe27a 0,#ffb21e 16%,rgba(255,178,30,0) 38%),linear-gradient(160deg,#025f55,#037e70 55%,#13a58c);color:#fff;padding:52px 20px 0}
.hero .tt{font-size:30px;font-weight:900;line-height:1.05}.hero .st{font-size:13px;margin-top:8px;opacity:.95;max-width:220px}
.hero .cn{position:absolute;right:26px;top:70px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc531 45%,#e79400);box-shadow:0 5px 0 #b86f00,0 10px 20px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#9a5600}
.hb{position:absolute;top:10px;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:9px;font-weight:700}
.hb b{font-size:16px;line-height:1}
#hbBack{left:10px}#hbHist{right:56px}#hbRules{right:10px}
.card{margin:10px;background:#fff;border-radius:18px;padding:14px;box-shadow:0 3px 12px rgba(10,90,80,.10)}
.card:first-of-type{margin-top:-24px;position:relative}
.ttl{display:flex;align-items:center;gap:7px;margin:0 0 10px}.ttl b{font-size:16px;color:#0b4f46;font-weight:800}.ttl .rt{margin-left:auto;font-size:11px;color:#888}
.res{text-align:center;padding:4px 0 2px}
.res .l{font-size:12px;color:#5a6b85}.res .v{font-size:38px;font-weight:900;color:#e0600b;line-height:1.15}.res .f{font-size:11.5px;color:#888;margin-top:2px}
.bets{display:flex;justify-content:space-between;background:#eef7f5;border-radius:12px;padding:9px 12px;margin:10px 0 0;font-size:12.5px;color:#4a5a75}.bets b{color:#0b4f46}
.btn{width:100%;border:none;border-radius:22px;padding:12px;font-size:16px;font-weight:900;color:#fff;background:linear-gradient(90deg,#ffb300,#ff7a00);cursor:pointer;margin-top:12px;box-shadow:0 3px 0 #c95c00}
.btn[disabled]{background:#d9dde5;color:#8a93a3;box-shadow:none;cursor:not-allowed}
.btn.done{background:#e6f6ea;color:#1f8a43;box-shadow:none;cursor:default}
.exp{text-align:center;font-size:11px;color:#c0540a;margin-top:6px}
.wait{text-align:center;padding:16px 0 6px;color:#4a5a75;font-size:13px}.wait .sp{width:30px;height:30px;border:3px solid #d6e2f5;border-top-color:#037e70;border-radius:50%;margin:0 auto 8px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.prow{display:flex;align-items:center;gap:10px;border-top:1px dashed #e3e8f1;padding:9px 2px}
.prow .d{flex:1;font-size:12px;color:#4a5a75}.prow .d b{display:block;font-size:14px;color:#0b4f46}.prow .a{font-size:16px;font-weight:900;color:#e0600b}
.sbtn{border:none;border-radius:16px;padding:6px 16px;font-size:13px;font-weight:800;color:#fff;background:linear-gradient(90deg,#ffb300,#ff7a00);cursor:pointer}
.sub{font-size:12px;color:#5a6b85;margin:2px 0 4px}
table.tier{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13px}
table.tier td{padding:9px 12px;background:#f2f7f6}table.tier td:first-child{border-radius:10px 0 0 10px}table.tier td:last-child{border-radius:0 10px 10px 0;text-align:right;font-weight:900;color:#e0600b}
table.tier tr.hit td{background:#fff4e0}table.tier tr.hit td:first-child{box-shadow:inset 3px 0 0 #ff9a00}
.tk{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:#ff9a00;border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.note{font-size:11.5px;color:#6b7a92;margin-top:4px}
.flycoin{position:absolute;left:0;top:0;width:24px;height:24px;z-index:40;pointer-events:none}
/* sheets */
.mask{position:absolute;inset:0;background:rgba(10,20,40,.45);display:none;z-index:20;align-items:flex-end}.mask.on{display:flex}
.sheet{width:100%;background:#fff;border-radius:22px 22px 0 0;max-height:60%;display:flex;flex-direction:column;overflow:hidden;animation:up .2s}@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.hsHead{background:linear-gradient(90deg,#025f55,#13a58c);color:#fff;font-size:17px;font-weight:800;text-align:center;padding:14px;position:relative}.x2{position:absolute;right:14px;top:12px;cursor:pointer}
.hsBody{overflow-y:auto;padding:12px 14px 22px}
table.h2{width:100%;border-collapse:collapse;font-size:12px}table.h2 th{background:#0b5d52;color:#fff;font-weight:600;padding:7px 6px;text-align:left}
table.h2 th:first-child{border-radius:10px 0 0 0}table.h2 th:last-child{border-radius:0 10px 0 0}table.h2 td{padding:7px 6px;border-bottom:1px solid #eee;background:#f1f8f6}
.stt{font-size:11px;font-weight:800;border-radius:8px;padding:1px 7px}.s-c{background:#e3f6e9;color:#1f8a43}.s-a{background:#e5efff;color:#1d5fc4}.s-e{background:#eee;color:#999}.s-n{color:#aaa}
.rh{font-size:16px;font-weight:800;color:#0b4f46;margin:2px 0 6px}.rl{padding-left:18px;margin:0 0 10px}.rl li{font-size:12.5px;margin:4px 0;color:#333}
table.rt{width:100%;border-collapse:collapse;font-size:11.5px}table.rt th{background:#0b5d52;color:#fff;padding:6px;text-align:left}table.rt td{padding:6px;background:#eef7f5;border-bottom:1px solid #e2e8f3}
.toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);background:rgba(30,30,30,.9);color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;z-index:30;display:none;max-width:280px;align-items:center;gap:9px}
.ti{flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;background:#2fd06b;color:#123}
/* panel */
.panel{width:300px;max-width:100%;background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.panel h5{font-size:14px;margin:16px 0 6px;color:#037e70}.panel h5:first-child{margin-top:0}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:6px}.sc.one{grid-template-columns:1fr}
.sc button{border:1.5px solid #d7dde2;background:#fafbfc;border-radius:10px;padding:7px 8px;text-align:left;font-size:12.5px;cursor:pointer}
.sc button.on{border-color:#037e70;background:#eaf7f3;font-weight:700}
.desc{font-size:12.5px;line-height:1.7;background:#f7f9fa;border-radius:10px;padding:10px 12px;margin-top:10px;color:#444}

const fmt=n=>'₱'+Number(n).toLocaleString('en-US');
const TIERS=[[1000,1],[5000,5],[10000,10]];   // 后台配置：投注满（≥）X 返 Y
const KEEP=3, AUTO_AT='9:00 AM', TODAY='Nov 18';  // 后台配置：领取有效期（天）、自动发放时间
const SC={
 top:{name:'昨日达到最高档（₱12,350）',bets:12350},
 mid:{name:'昨日达到中间档（₱6,200）',bets:6200},
 none:{name:'昨日未达标（₱650）',bets:650},
 pre:{name:'发放前（08:00）',bets:12350,pre:true}
};
let cfg={mode:'auto',calc:'single',sc:'top'},S;
function reward(b){const hit=TIERS.filter(t=>b>=t[0]);if(!hit.length)return {amt:0,hit:[]};return cfg.calc==='sum'?{amt:hit.reduce((a,t)=>a+t[1],0),hit}:{amt:hit[hit.length-1][1],hit:[hit[hit.length-1]]};}
function init(){const c=SC[cfg.sc];document.getElementById('toast').style.display='none';
 if(c.autoOnly&&cfg.mode!=='auto')cfg.mode='auto';if(c.manualOnly&&cfg.mode!=='manual')cfg.mode='manual';
 S={bets:c.bets,claimed:false,pre:!!c.pre,bal:13887.68,
   older:(c.older||[]).map(o=>({d:o[0],bets:o[1],claimed:false})),
   rec:[['Nov 14',8200,'c'],['Nov 13',1500,'c'],['Nov 12',400,'n'],['Nov 11',11000,'e'],['Nov 10',5300,'c'],['Nov 9',2100,'c'],['Nov 8',12800,'c'],['Nov 7',900,'n'],['Nov 6',6100,'c'],['Nov 5',3300,'c'],['Nov 4',10200,'c'],['Nov 3',700,'n']]};
 if(cfg.mode==='auto')S.rec=S.rec.map(r=>[r[0],r[1],r[2]==='n'?'n':'a']);
 renderPanel();go('act');render();}
function pick(k,v){cfg[k]=v;init();}
function renderPanel(){const b=(k,v,t)=>`<button class="${cfg[k]===v?'on':''}" onclick="pick('${k}','${v}')">${t}</button>`;
 document.getElementById('pCalc').innerHTML=b('calc','single','不累加（默认）')+b('calc','sum','累加');
 document.getElementById('pSc').innerHTML=Object.entries(SC).map(([k,v])=>b('sc',k,v.name)).join('');
 const r=reward(SC[cfg.sc].bets);
 document.getElementById('desc').innerHTML=`今天 ${TODAY}。档位：≥₱1,000 返 ₱1，≥₱5,000 返 ₱5，≥₱10,000 返 ₱10。<br>`+(cfg.sc==='none'?'昨日投注未达到最低档，没有奖励。':cfg.sc==='multi'?`手动领取的奖励保留 ${KEEP} 天（后台配置，只对手动领取生效），过期作废；每天的奖励分别领取。`:cfg.sc==='pre'?`自动发放：每天 ${AUTO_AT}（后台配置）自动发放到余额。界面始终显示说明「每天 ${AUTO_AT} 自动发放」；发放前按钮显示发放时间。自动发放没有领取期限。`:`昨日投注 ${fmt(SC[cfg.sc].bets)}，${cfg.calc==='sum'?'累加：达到的各档奖励相加':'不累加：只取达到的最高一档'}，奖励 ${fmt(r.amt)}。`);}
function render(){const b=document.getElementById('actBody'),r=reward(S.bets),man=cfg.mode==='manual';let top;
 {
  let act='';
  if(!r.amt)act=`<button class="btn" disabled>No reward</button><div class="exp" style="color:#888">Bet ${fmt(TIERS[0][0])} or more in a day to get a reward.</div>`;
  else if(man)act=S.claimed?`<button class="btn done">✓ Claimed</button>`:`<button class="btn pulse" id="clm" onclick="claim()">Claim</button><div class="exp">Claim by ${expDay()}</div>`;
  else act=(S.pre?`<button class="btn" disabled>Credits at ${AUTO_AT}</button>`:`<button class="btn done">✓ Credited to your balance</button>`)+`<div class="exp" style="color:#037e70">Rewards are sent automatically at ${AUTO_AT} every day.</div>`;
  top=`<div class="res"><div class="l">Your Reward</div><div class="v">${fmt(r.amt)}</div></div>
   <div class="bets"><span>Yesterday's bets</span><b>${fmt(S.bets)}</b></div>${act}`;}
 const older=S.older.filter(o=>!o.claimed);
 b.innerHTML=`<div class="card"><div class="ttl"><b>Yesterday's Reward</b><span class="rt">Nov 17</span></div>${top}
  ${older.length?`<div class="sub" style="margin-top:12px"><b>Unclaimed</b></div>${older.map((o,i)=>`<div class="prow"><div class="d"><b>${o.d}</b>Bets ${fmt(o.bets)} · Claim by ${expDay(o.d)}</div><div class="a">${fmt(reward(o.bets).amt)}</div><button class="sbtn" onclick="claimOld(${S.older.indexOf(o)},this)">Claim</button></div>`).join('')}`:''}</div>
 <div class="card"><div class="ttl"><b>Reward Tiers</b><span class="rt">Daily bets</span></div>
  <table class="tier">${TIERS.map(t=>{const h=S.bets>=t[0];return `<tr class="${h?'hit':''}"><td>Bet ≥ ${fmt(t[0])}${h?'<span class="tk">Reached</span>':''}</td><td>${fmt(t[1])}</td></tr>`}).join('')}</table>
  <div class="note">${cfg.calc==='sum'?'Rewards of all tiers you reach are added up.':'You get the reward of the highest tier you reach.'}</div></div>`;}
function expDay(d){const n=d?parseInt(d.split(' ')[1]):17;return 'Nov '+(n+KEEP);}
function fly(el,done){const sc=document.getElementById('screen').getBoundingClientRect(),f=el.getBoundingClientRect();
 for(let k=0;k<8;k++){const c=document.createElement('img');c.src=IMG.coins;c.className='flycoin';document.getElementById('screen').appendChild(c);
  const x0=f.left-sc.left+f.width/2-12+(Math.random()*40-20),y0=f.top-sc.top,x1=sc.width-60,y1=20;
  c.animate([{transform:`translate(${x0}px,${y0}px) scale(.6)`,opacity:0},{transform:`translate(${x0}px,${y0-40}px) scale(1.15)`,opacity:1,offset:.3},{transform:`translate(${x1}px,${y1}px) scale(.4)`,opacity:0}],{duration:800,delay:k*55}).onfinish=()=>c.remove();}
 setTimeout(()=>done&&done(),900);}
function claim(){const r=reward(S.bets);const el=document.getElementById('clm');el.style.visibility='hidden';S.claimed=true;S.bal+=r.amt;S.rec.unshift(['Nov 17',S.bets,'c']);fly(el,()=>{render();toastI('Claimed '+fmt(r.amt),'Added to your balance');});}
function claimOld(i,el){const o=S.older[i];o.claimed=true;el.style.visibility='hidden';const a=reward(o.bets).amt;S.rec.unshift([o.d,o.bets,'c']);fly(el,()=>{render();toastI('Claimed '+fmt(a),'Added to your balance');});}
function stTag(s){return s==='c'?'<span class="stt s-c">Claimed</span>':s==='a'?'<span class="stt s-a">Credited</span>':s==='e'?'<span class="stt s-e">Expired</span>':'<span class="stt s-n">—</span>';}
function openHist(){const rows=S.rec.slice().sort((a,b)=>parseInt(b[0].split(' ')[1])-parseInt(a[0].split(' ')[1]));
 openM(`<div class="hsHead">History<span class="x2" onclick="closeM()">✕</span></div><div class="hsBody"><table class="h2"><tr><th>Date</th><th>Bets</th><th>Reward</th><th>Status</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${fmt(r[1])}</td><td><b>${fmt(reward(r[1]).amt)}</b></td><td>${stTag(r[2])}</td></tr>`).join('')}</table><div style="text-align:center;font-size:11.5px;color:#999;padding:10px 0 0">No more records</div></div>`);}
function openRules(){openM(`<div class="hsHead">Activity description<span class="x2" onclick="closeM()">✕</span></div><div class="hsBody">
 <div class="rh">Daily Bet Bonus</div>
 <ol class="rl"><li>Your valid bets on eligible games from 00:00 to 23:59 each day are added up.</li>
 <li>Reach a tier to get its reward:</li></ol>
 <table class="rt"><tr><th>Daily bets</th><th>Reward</th></tr>${TIERS.map(t=>`<tr><td>≥ ${fmt(t[0])}</td><td>${fmt(t[1])}</td></tr>`).join('')}</table>
 <ol class="rl" start="3" style="margin-top:10px"><li>${cfg.calc==='sum'?'Rewards of all tiers you reach are added up.':'You get the reward of the highest tier you reach.'}</li>
 <li>One reward per day. Results are ready after 1:00 AM the next day.</li>
 <li>${cfg.mode==='manual'?`Claim your reward within ${KEEP} days, or it expires.`:`Rewards are sent to your balance automatically at ${AUTO_AT}.`}</li>
 <li>Rewards need 1x wagering before withdrawal.</li></ol></div>`);}
function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));document.getElementById(v).scrollTop=0;closeM();}
function openM(h){document.getElementById('sheet').innerHTML=h;document.getElementById('mask').classList.add('on');}
function closeM(){document.getElementById('mask').classList.remove('on');}
document.getElementById('mask').addEventListener('click',e=>{if(e.target.id==='mask')closeM();});
function toastI(t,sub){const e=document.getElementById('toast');e.innerHTML=`<span class="ti">✓</span><div><div style="font-weight:700">${t}</div>${sub?`<div style="font-size:11.5px;opacity:.85">${sub}</div>`:''}</div>`;e.style.display='flex';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2200);}
function enter(){go('act');}
function toast(t){const e=document.getElementById('toast');e.innerHTML=t;e.style.display='flex';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1800);}
init();
</script>
</body></html>
